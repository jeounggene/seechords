# fly.toml — SeeChords API server (lightweight, no ML libs)
# Chord analysis is delegated to ephemeral seechords-worker machines.

app = 'seechords'
primary_region = 'sjc'

[build]
  dockerfile = "../Dockerfile.api"
  context = ".."

[env]
  FLASK_ENV = 'production'
  UPLOAD_DIR = '/tmp/uploads'
  FLY_WORKER_APP = 'seechords-worker'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
