# fly.toml app configuration file generated for seechords on 2026-03-26T00:30:07-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'seechords'
primary_region = 'sjc'

[build]
  dockerfile = "../Dockerfile"
  context = ".."

[env]
  DB_PATH = '/data/seechords.db'
  FLASK_ENV = 'production'
  UPLOAD_DIR = '/data/uploads'
  # Optional: SEECHORDS_DONATION_URL / SEECHORDS_CHROME_STORE_URL override defaults in app.py

[[mounts]]
  source = 'seechords_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
