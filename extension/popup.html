<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080812;
      color: #f0f0f8;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
    }
    .tagline {
      font-size: .75rem;
      color: #8888aa;
    }
    .status-card {
      background: #12122a;
      border: 1px solid #2a2a50;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-msg {
      font-size: .8rem;
      color: #8888aa;
      line-height: 1.4;
    }
    .status-msg.success { color: #7dffb3; }
    .status-msg.error { color: #ff9966; }
    .vid-id {
      font-family: monospace;
      font-size: .78rem;
      color: #b47bff;
      background: #1a1a36;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .footer {
      font-size: .7rem;
      color: #555;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🎸 SeeChords</span>
  </div>
  <p class="tagline" style="margin-bottom: 14px;">Chord overlays on YouTube videos</p>

  <div class="status-card">
    <div class="status-title" id="statusTitle">Checking…</div>
    <div class="status-msg" id="statusMsg">Looking for current video…</div>
  </div>

  <div class="footer">SeeChords v1.0 — Chords overlay for YouTube</div>

  <script src="popup.js"></script>
</body>
</html>
